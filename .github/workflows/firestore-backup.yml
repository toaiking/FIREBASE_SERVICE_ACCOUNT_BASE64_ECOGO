# Firestore Backup - Thứ 2, 4, 6
# Chạy lúc 20:23 GMT+7 (13:23 UTC) — phút lẻ tránh kẹt hàng đợi GitHub Actions, trước khi Firestore reset quota lúc 22:00 GMT+7
#
# Secrets cần cấu hình trong repo Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT_BASE64  : Service account JSON đã encode base64
#   EMAIL_USERNAME                    : Gmail gửi (vd: yourapp@gmail.com)
#   EMAIL_PASSWORD                    : App Password của Gmail
#   EMAIL_TO                          : Email nhận backup

name: Firestore Backup - T2 T4 T6

on:
  schedule:
    - cron: '23 13 * * 1,3,5'  # 20:23 GMT+7 mỗi T2, T4, T6 (UTC 13:23) - phút lẻ chạy ngay không bị trễ
  workflow_dispatch:            # Cho phép chạy thủ công

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node.js 22 ─────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Cài dependencies ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 4. Lấy ngày giờ hiện tại (Vietnam time) ─────────────────────────────
      - name: Get current date
        id: date
        run: |
          echo "today=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
          echo "dateonly=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          # Xác định thứ trong tuần để đặt tên file rõ ràng
          DOW=$(TZ='Asia/Ho_Chi_Minh' date +'%u')  # 1=Mon,3=Wed,5=Fri
          case $DOW in
            1) DAY_NAME="T2" ;;
            3) DAY_NAME="T4" ;;
            5) DAY_NAME="T6" ;;
            *) DAY_NAME="TD" ;;
          esac
          echo "dayname=$DAY_NAME" >> $GITHUB_OUTPUT

      # ── 5. Tạo và chạy backup script (Tối ưu siêu tốc song song) ────────────
      - name: Run Firestore backup
        run: |
          node - << 'EOF'
          "use strict";
          const admin = require("firebase-admin");
          const fs = require("fs");
          const zlib = require("zlib");

          // Parse service account
          let serviceAccount;
          try {
            serviceAccount = JSON.parse(
              Buffer.from(process.env.FIREBASE_SERVICE_ACCOUNT_BASE64, "base64").toString("utf8")
            );
          } catch (err) {
            console.error("Loi: Khong the parse FIREBASE_SERVICE_ACCOUNT_BASE64");
            process.exit(1);
          }

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
          });
          const db = admin.firestore();

          // Chuyển đổi timestamp của Firestore sang ISO string an toàn
          function normalizeDocData(raw, id) {
            const data = { _id: id };
            for (const [k, v] of Object.entries(raw)) {
              if (v && typeof v.toDate === "function") {
                data[k] = v.toDate().toISOString();
              } else if (Array.isArray(v)) {
                data[k] = v.map((item) => {
                  if (item && typeof item === "object") {
                    const normItem = {};
                    for (const [ik, iv] of Object.entries(item)) {
                      normItem[ik] = (iv && typeof iv.toDate === "function") ? iv.toDate().toISOString() : iv;
                    }
                    return normItem;
                  }
                  return item;
                });
              } else {
                data[k] = v;
              }
            }
            return data;
          }

          // Đọc trực tiếp snapshot toàn bộ collection song song siêu tốc
          async function exportCollectionFast(colRef) {
            const snapshot = await colRef.get();
            return snapshot.docs.map((doc) => normalizeDocData(doc.data(), doc.id));
          }

          async function main() {
            const startTime = Date.now();
            console.log("=".repeat(50));
            console.log("Bat dau backup Firestore (Che do song song sieu toc)");
            console.log("Thoi gian: " + new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }));
            console.log("=".repeat(50));

            const backup = {
              _meta: {
                exportedAt: new Date().toISOString(),
                projectId: serviceAccount.project_id,
              },
            };

            const collections = await db.listCollections();
            if (collections.length === 0) {
              console.log("Canh bao: Khong tim thay collection nao.");
            }

            console.log(`Tim thay ${collections.length} collections: ${collections.map((c) => c.id).join(", ")}`);

            // Xuất song song tất cả collections với Promise.all
            const colPromises = collections.map(async (col) => {
              const startCol = Date.now();
              const docs = await exportCollectionFast(col);
              const elapsedCol = ((Date.now() - startCol) / 1000).toFixed(2);
              console.log(`  -> ${col.id}: ${docs.length} documents (${elapsedCol}s)`);
              return { id: col.id, docs };
            });

            const results = await Promise.all(colPromises);
            let totalDocs = 0;
            for (const res of results) {
              backup[res.id] = res.docs;
              totalDocs += res.docs.length;
            }

            const date = new Date().toISOString().slice(0, 10);
            const jsonStr = JSON.stringify(backup, null, 2);
            const rawSizeKB = (Buffer.byteLength(jsonStr) / 1024).toFixed(1);

            // Nén gzip trực tiếp để tiết kiệm dung lượng lưu trữ & đính kèm email
            const compressed = zlib.gzipSync(Buffer.from(jsonStr, "utf8"), { level: 9 });
            const filename = "backup-" + date + ".json.gz";
            fs.writeFileSync(filename, compressed);

            const gzSizeKB = (fs.statSync(filename).size / 1024).toFixed(1);
            const ratio = ((1 - gzSizeKB / rawSizeKB) * 100).toFixed(1);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

            console.log("=".repeat(50));
            console.log("Backup hoan tat   : " + filename);
            console.log("Tong collections  : " + (Object.keys(backup).length - 1));
            console.log("Tong documents    : " + totalDocs);
            console.log("Kich thuoc JSON   : " + rawSizeKB + " KB");
            console.log("Kich thuoc nen GZ : " + gzSizeKB + " KB (giam " + ratio + "%)");
            console.log("Thoi gian chay    : " + elapsed + "s (sieu toc!)");
            console.log("=".repeat(50));
          }

          main()
            .then(() => process.exit(0))
            .catch((err) => {
              console.error("LOI BACKUP:", err.message || err);
              process.exit(1);
            });
          EOF

      # ── 6. Upload artifact (lưu 90 ngày) ────────────────────────────────────
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ steps.date.outputs.dateonly }}-${{ steps.date.outputs.dayname }}
          path: backup-*.json*
          retention-days: 90

      # ── 7. Trigger dashboard build ───────────────────────────────────────────
      - name: Trigger dashboard build
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: backup-completed
          client-payload: '{"date": "${{ steps.date.outputs.dateonly }}", "day": "${{ steps.date.outputs.dayname }}"}'

      # ── 8. Gửi email khi thành công ──────────────────────────────────────────
      - name: Send backup via email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          to: ${{ env.EMAIL_TO }}
          from: "EcoGo Backup <${{ env.EMAIL_USERNAME }}>"
          subject: "[Backup ${{ steps.date.outputs.dayname }}] Firestore - ${{ steps.date.outputs.today }}"
          body: |
            ✅ Backup Firestore hoàn tất thành công!

            Ngày backup : ${{ steps.date.outputs.today }} (GMT+7)
            Lịch backup : Thứ 2, 4, 6 lúc 20:00 GMT+7
            Repository  : ${{ github.repository }}
            Chi tiết    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            File backup được nén Gzip (.json.gz) và đính kèm bên dưới.
            File cũng được lưu trên GitHub Artifacts trong 90 ngày.

            ---
            Email này được gửi tự động bởi GitHub Actions.
          attachments: backup-*.json*

      # ── 9. Gửi email khi thất bại ────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          to: ${{ env.EMAIL_TO }}
          from: "EcoGo Backup <${{ env.EMAIL_USERNAME }}>"
          subject: "[THẤT BẠI] Firestore Backup ${{ steps.date.outputs.dayname }} - ${{ steps.date.outputs.today }}"
          body: |
            ❌ CẢNH BÁO: Backup Firestore thất bại!

            Ngày       : ${{ steps.date.outputs.today }} (GMT+7)
            Repository : ${{ github.repository }}
            Chi tiết   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Vui lòng kiểm tra log để biết nguyên nhân.
