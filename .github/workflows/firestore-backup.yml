# Firestore Backup & Daily Report - Hàng ngày
# Chạy lúc 20:23 GMT+7 (13:23 UTC) — phút lẻ tránh kẹt hàng đợi GitHub Actions, trước khi Firestore reset quota lúc 22:00 GMT+7
#
# Secrets cần cấu hình trong repo Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT_BASE64  : Service account JSON đã encode base64
#   EMAIL_USERNAME                   : Gmail gửi (vd: yourapp@gmail.com)
#   EMAIL_PASSWORD                   : App Password của Gmail
#   EMAIL_TO                         : Email nhận backup
#   TELEGRAM_BOT_TOKEN (tuỳ chọn)    : Bot Token gửi báo cáo & cảnh báo lỗi (tự fallback từ Firestore settings/telegramConfig)
#   TELEGRAM_CHAT_ID   (tuỳ chọn)    : Chat ID / Group ID nhận báo cáo (tự fallback từ Firestore settings/telegramConfig)

name: Firestore Daily Backup & Report

on:
  schedule:
    - cron: '23 13 * * *'  # 20:23 GMT+7 hàng ngày (UTC 13:23)
  workflow_dispatch:       # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node.js 22 ─────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Cài dependencies ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ── 4. Lấy ngày giờ hiện tại (chuẩn GMT+7 Asia/Ho_Chi_Minh) ─────────────
      - name: Get current date (Vietnam GMT+7)
        id: date
        run: |
          echo "today=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
          echo "dateonly=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          DOW=$(TZ='Asia/Ho_Chi_Minh' date +'%u')  # 1=T2 .. 7=CN
          case $DOW in
            1) DAY_NAME="T2" ;;
            2) DAY_NAME="T3" ;;
            3) DAY_NAME="T4" ;;
            4) DAY_NAME="T5" ;;
            5) DAY_NAME="T6" ;;
            6) DAY_NAME="T7" ;;
            7) DAY_NAME="CN" ;;
            *) DAY_NAME="TD" ;;
          esac
          echo "dayname=$DAY_NAME" >> $GITHUB_OUTPUT

      # ── 5. Chạy backup Firestore phân trang + kiểm tra toàn vẹn ───────────────
      - name: Run Firestore backup
        id: backup
        run: node .github/scripts/backup-firestore.js

      # ── 6. Upload artifact (lưu 90 ngày) ────────────────────────────────────
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ steps.backup.outputs.date_vn }}-${{ steps.date.outputs.dayname }}
          path: |
            backup-*.json*
            backup-summary.json
          retention-days: 90

      # ── 7. Gửi báo cáo tổng kết cuối ngày qua Telegram (Mobile-first) ────────
      - name: Send daily report via Telegram
        if: success()
        continue-on-error: true
        run: |
          node .github/scripts/send-daily-report.js \
            --mode=daily \
            --backup="${{ steps.backup.outputs.filename }}" \
            --summary="backup-summary.json"

      # ── 8. Trigger dashboard build ───────────────────────────────────────────
      - name: Trigger dashboard build
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: backup-completed
          client-payload: '{"date": "${{ steps.backup.outputs.date_vn }}", "day": "${{ steps.date.outputs.dayname }}"}'

      # ── 9a. Gửi email kèm file backup (< 20MB an toàn cho Gmail SMTP) ────────
      - name: Send backup via email (with attachment)
        if: success() && steps.backup.outputs.can_attach_email == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          to: ${{ env.EMAIL_TO }}
          from: "EcoGo Backup <${{ env.EMAIL_USERNAME }}>"
          subject: "[Backup ${{ steps.date.outputs.dayname }}] Firestore - ${{ steps.date.outputs.today }}"
          body: |
            ✅ Backup Firestore hàng ngày hoàn tất thành công!

            Ngày backup : ${{ steps.date.outputs.today }} (GMT+7)
            Lịch backup : Hàng ngày lúc 20:23 GMT+7
            Tổng docs   : ${{ steps.backup.outputs.total_docs }}
            Dung lượng  : ${{ steps.backup.outputs.gz_size_kb }} KB (${{ steps.backup.outputs.gz_size_mb }} MB)
            SHA-256     : ${{ steps.backup.outputs.sha256 }}
            Repository  : ${{ github.repository }}
            Chi tiết    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            File backup được nén Gzip (.json.gz) và đính kèm bên dưới.
            File cũng được lưu trên GitHub Artifacts trong 90 ngày.
          attachments: backup-*.json*

      # ── 9b. Gửi email link Artifact nếu file >= 20MB (tránh Gmail từ chối ngầm) ─
      - name: Send backup notification via email (artifact link only, >= 20MB)
        if: success() && steps.backup.outputs.can_attach_email != 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          to: ${{ env.EMAIL_TO }}
          from: "EcoGo Backup <${{ env.EMAIL_USERNAME }}>"
          subject: "[Backup ${{ steps.date.outputs.dayname }}] Firestore (${{ steps.backup.outputs.gz_size_mb }} MB) - ${{ steps.date.outputs.today }}"
          body: |
            ✅ Backup Firestore hàng ngày hoàn tất thành công!

            ⚠️ File nén đạt ${{ steps.backup.outputs.gz_size_mb }} MB (vượt ngưỡng đính kèm an toàn 20MB của Gmail) nên không đính kèm trực tiếp.
            Vui lòng tải file backup tại GitHub Actions Artifacts (lưu 90 ngày):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Ngày backup : ${{ steps.date.outputs.today }} (GMT+7)
            Tổng docs   : ${{ steps.backup.outputs.total_docs }}
            SHA-256     : ${{ steps.backup.outputs.sha256 }}

      # ── 10. Cảnh báo khẩn qua Telegram + Email khi thất bại ─────────────────
      - name: Alert failure via Telegram
        if: failure()
        continue-on-error: true
        run: |
          node .github/scripts/send-daily-report.js \
            --mode=failure \
            --workflow="Firestore Daily Backup & Report" \
            --date="${{ steps.date.outputs.today }}" \
            --repo="${{ github.repository }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify on failure via Email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          to: ${{ env.EMAIL_TO }}
          from: "EcoGo Backup <${{ env.EMAIL_USERNAME }}>"
          subject: "[THẤT BẠI] Firestore Backup ${{ steps.date.outputs.dayname }} - ${{ steps.date.outputs.today }}"
          body: |
            ❌ CẢNH BÁO: Backup Firestore thất bại!

            Ngày       : ${{ steps.date.outputs.today }} (GMT+7)
            Repository : ${{ github.repository }}
            Chi tiết   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Vui lòng kiểm tra log để biết nguyên nhân.
