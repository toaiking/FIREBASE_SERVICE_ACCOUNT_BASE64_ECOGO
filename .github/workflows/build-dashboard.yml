# Build & Deploy Dashboard - Chạy sau mỗi lần backup hoàn tất
# Deploy lên GitHub Pages tại: https://<username>.github.io/<repo>/
#
# Secrets khuyên dùng để bảo vệ dữ liệu trên GitHub Pages:
#   DASHBOARD_PASSWORD   : Mật khẩu mã hóa AES-256-GCM toàn bộ dữ liệu trước khi nhúng vào HTML
#   TELEGRAM_BOT_TOKEN   : Token Bot Telegram cảnh báo khi job build/deploy lỗi
#   TELEGRAM_CHAT_ID     : Chat ID nhận cảnh báo lỗi

name: Build Order Dashboard

on:
  repository_dispatch:
    types:
      - "backup-completed"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Tải các artifacts backup gần nhất (tối đa 30 kỳ để nhanh & ổn định) ──
      - name: Download backup artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const allArtifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const backupArtifacts = allArtifacts
              .filter(a => a.name && a.name.startsWith('firestore-backup-') && !a.expired)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              .slice(-30);

            console.log(`Tìm thấy ${backupArtifacts.length} backup artifacts gần nhất`);

            fs.mkdirSync('backups', { recursive: true });

            for (const artifact of backupArtifacts) {
              console.log(`Downloading: ${artifact.name}`);
              try {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                const zipPath = `backups/${artifact.name}.zip`;
                fs.writeFileSync(zipPath, Buffer.from(download.data));

                const { execSync } = require('child_process');
                execSync(`unzip -o "${zipPath}" -d backups/ && rm "${zipPath}"`);
              } catch (err) {
                console.warn(`Không thể tải ${artifact.name}: ${err.message}`);
              }
            }

            const files = fs.readdirSync('backups').filter(f => f.match(/^backup-.*\.json(\.gz)?$/));
            console.log(`Đã tải ${files.length} file backup:`, files.join(', '));

      # ── Build dashboard HTML ─────────────────────────────────────────────────
      - name: Build dashboard
        run: node .github/scripts/build-dashboard.js

      # ── Upload cho Pages ─────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Alert failure via Telegram
        if: failure()
        continue-on-error: true
        run: |
          DATE_VN=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M')
          node .github/scripts/send-daily-report.js \
            --mode=failure \
            --workflow="Build Order Dashboard (Build)" \
            --date="$DATE_VN" \
            --repo="${{ github.repository }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repo for alert script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Alert failure via Telegram
        if: failure()
        continue-on-error: true
        run: |
          DATE_VN=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M')
          node .github/scripts/send-daily-report.js \
            --mode=failure \
            --workflow="Build Order Dashboard (Deploy)" \
            --date="$DATE_VN" \
            --repo="${{ github.repository }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
